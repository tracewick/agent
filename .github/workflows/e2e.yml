name: E2E

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  PYROSCOPE_URL: http://127.0.0.1:4040
  PYROSCOPE_TOXIC_URL: http://127.0.0.1:14040
  TOXIPROXY_URL: http://127.0.0.1:8474

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Prepare PHP tracewick-drain
        run: make php-drain

      - name: Start stand (Pyroscope + Toxiproxy)
        run: make stand-up

      - name: Stand smoke
        run: make stand-smoke

      # UID-mismatch e2e needs busybox for named-volume DAC checks.
      - name: Pull busybox for UID e2e
        run: docker pull busybox:1.36

      - name: Cross-process E2E
        run: make e2e
        env:
          TRACEWICK_DRAIN_BIN: ${{ github.workspace }}/.cache/php-drain/vendor/bin/tracewick-drain

      - name: Stop stand
        if: ${{ always() }}
        run: make stand-down
