# UID-compatible spool example.
# PHP-FPM (or any writer) and the agent MUST share SPOOL_UID/SPOOL_GID.
# Spool path mode 0700 / files 0600 — mismatched UIDs cannot claim files.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Replace the stub "php-writer" with your real app container; keep the same user.

name: tracewick-agent-demo

x-spool-user: &spool-user
  user: "${SPOOL_UID:-33}:${SPOOL_GID:-33}"

services:
  spool-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - spool:/var/spool/tracewick
    command:
      - sh
      - -c
      - |
        mkdir -p /var/spool/tracewick
        chown ${SPOOL_UID:-33}:${SPOOL_GID:-33} /var/spool/tracewick
        chmod 0700 /var/spool/tracewick

  # Stand-in for PHP-FPM / worker. Real deployments replace this service.
  php-writer:
    <<: *spool-user
    image: busybox:1.36
    depends_on:
      spool-init:
        condition: service_completed_successfully
    volumes:
      - spool:/var/spool/tracewick
    working_dir: /var/spool/tracewick
    # Touch a placeholder so operators can verify the UID owns the directory.
    command: ["sh", "-c", "touch .writer-ok && sleep infinity"]

  agent:
    <<: *spool-user
    build:
      context: ..
      dockerfile: Dockerfile
    image: tracewick-agent:local
    depends_on:
      spool-init:
        condition: service_completed_successfully
      php-writer:
        condition: service_started
    environment:
      TRACEWICK_SPOOL_DIR: /var/spool/tracewick
      TRACEWICK_PYROSCOPE_URL: ${TRACEWICK_PYROSCOPE_URL:-http://host.docker.internal:4040}
      TRACEWICK_PYROSCOPE_USER: ${TRACEWICK_PYROSCOPE_USER:-}
      TRACEWICK_PYROSCOPE_PASSWORD: ${TRACEWICK_PYROSCOPE_PASSWORD:-}
      TRACEWICK_PYROSCOPE_TENANT: ${TRACEWICK_PYROSCOPE_TENANT:-}
      TRACEWICK_METRICS_LISTEN: ${TRACEWICK_METRICS_LISTEN:-}
    volumes:
      - spool:/var/spool/tracewick
    command:
      - run
      - --reader-id=compose-agent
      - --sleep=5s
    restart: unless-stopped

volumes:
  spool:
