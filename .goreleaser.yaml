# Multi-arch binaries and GHCR images, with SBOMs and keyless signatures.
version: 2

project_name: tracewick-agent

builds:
  - id: tracewick-agent
    main: ./cmd/tracewick-agent
    binary: tracewick-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tracewick/agent/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# These SBOMs describe the actual archives, not the source checkout.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
      - "--source-name={{ .ProjectName }}"
      - "--source-version={{ .Version }}"

# The checksum manifest covers both archives and their SBOMs.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

dockers_v2:
  - id: tracewick-agent
    ids: [tracewick-agent]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/tracewick/agent
    tags:
      - "{{ .Version }}"
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # BuildKit attaches per-platform SPDX SBOMs to the OCI index.
    sbom: true
    annotations:
      "index:org.opencontainers.image.version": "{{ .Version }}"
      "index:org.opencontainers.image.revision": "{{ .FullCommit }}"
    labels:
      "org.opencontainers.image.title": "tracewick-agent"
      "org.opencontainers.image.description": "Tracewick spool sidecar for Pyroscope"
      "org.opencontainers.image.source": "https://github.com/tracewick/agent"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"

# Sign the index by digest, binding its platform manifests and SBOM attestations.
docker_signs:
  - artifacts: ""
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  # release-please already wrote the changelog body.
  mode: append
  footer: |
    ---
    Archive SBOMs and a Sigstore bundle for `checksums.txt` accompany this release.
    GHCR image indexes are signed by digest and include per-platform SPDX SBOMs.
    Verify the release workflow completed successfully and follow the
    [verification instructions](https://github.com/tracewick/agent/blob/main/deploy/verify-release.md).
