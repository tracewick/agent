name: Release

# Git flow releases: a release/* branch is merged into main, then release-please
# opens a release pull request into main with the changelog and version. Merging
# that pull request tags vX.Y.Z. GoReleaser publishes binaries + GHCR images when
# the tag is created (see .goreleaser.yaml). This workflow then opens a pull
# request merging main back into develop.
#
# Prefer a dedicated GitHub App (RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY) so the
# App can bypass the tag ruleset and its pull requests trigger CI — same pattern
# as tracewick/tracewick. See CONTRIBUTING.md.
#
# GHCR: custom GitHub Apps cannot Create organization package; use GITHUB_TOKEN
# for docker login/push. App token stays for release asset upload (contents).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to (re)publish with GoReleaser only (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Get a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  goreleaser:
    name: GoReleaser
    needs: [release-please]
    # always(): still run on workflow_dispatch when release-please is skipped.
    if: ${{ always() && !cancelled() && github.repository == 'tracewick/agent' && github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.publish_tag }}
    steps:
      - name: Validate the release tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require a tag from main with signed-release support
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -f scripts/check-release-artifacts.py

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      # contents only — custom Apps cannot Create organization package on GHCR.
      - name: Get a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          # App token uploads assets to the App-created release; GHCR uses docker login above.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Verify published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-verification"
          python3 scripts/check-release-artifacts.py "$RUNNER_TEMP/release-verification" \
            --version "${RELEASE_TAG#v}"

      - name: Verify published image signature, revision and SBOMs
        shell: bash
        run: |
          IMAGE=ghcr.io/tracewick/agent
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}" --format '{{.Manifest.Digest}}')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          cosign verify \
            --certificate-identity 'https://github.com/tracewick/agent/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | \
            jq -e --arg ver "${RELEASE_TAG#v}" --arg rev "$(git rev-parse HEAD)" \
              '.annotations["org.opencontainers.image.version"] == $ver and
               .annotations["org.opencontainers.image.revision"] == $rev'
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' > "$RUNNER_TEMP/image-sboms.json"
          jq -e '. as $sboms | ["linux/amd64", "linux/arm64"] | all(.[];
            $sboms[.].SPDX | (.spdxVersion | startswith("SPDX-")) and
            ([.packages[].name] | index("base-files") != null and
              index("stdlib") != null and index("github.com/tracewick/agent") != null))' \
            "$RUNNER_TEMP/image-sboms.json"

  back-merge:
    name: Merge main back into develop
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Get a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open a back-merge pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge $TAG back into develop" \
            --body "Brings the changelog and version of $TAG from main into develop. Merge with a merge commit, not a squash."
