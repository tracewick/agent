name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: v2.15.0
  GREMLINS_VERSION: v0.6.0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # Mutation adds ~2m on core packages; keep headroom above the old 15m budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod / go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then git diff --exit-code -- go.sum; fi

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check gofumpt
        run: |
          diff="$(gofumpt -extra -l .)"
          if [ -n "$diff" ]; then
            echo "gofumpt needed on:"
            echo "$diff"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Tests with race and coverage
        id: tests
        run: |
          mkdir -p build/coverage
          go test -race ./...
          go test -race -covermode=atomic -coverprofile=build/coverage/coverage.out ./internal/...
          go tool cover -func=build/coverage/coverage.out

      - name: Validate pprof golden files with go tool pprof
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: make pprof-check

      - name: Fuzz smoke (SpoolFile parse)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: make fuzz-smoke

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Mutation testing (Gremlins)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}
          make mutation

  matrix:
    name: Tests (Go ${{ matrix.go }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.3"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Tests
        run: go test -race ./...
